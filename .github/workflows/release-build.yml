name: Release build

# Called by Create release PR on the release branch before the pull request
# exists (D28). ri-release-macos-signed runs build.sh with the Developer ID
# certificates in a temporary keychain, then notarizes, staples and checks the
# package. Read-only: nothing here writes the repository.
on:
  workflow_call:
    inputs:
      version:
        description: The version being released.
        type: string
        required: true
      ref:
        description: The release branch head to build.
        type: string
        required: true

permissions:
  contents: read

jobs:
  macos:
    uses: oposs/repo-infra/.github/workflows/ri-release-macos-signed.yml@feat/ri-release-macos-signed
    with:
      version: ${{ inputs.version }}
      ref: ${{ inputs.ref }}
      # signed whenever the piece imported the certificates; the piece notarizes
      build: REQUIRE_SIGNING=$MACOS_SIGNING NOTARIZE=0 ./build.sh
      assets: build/MountWell-*.pkg
    secrets:
      MACOS_CERTS_P12: ${{ secrets.MACOS_CERTS_P12 }}
      MACOS_CERTS_PASSWORD: ${{ secrets.MACOS_CERTS_PASSWORD }}
      NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}

name: Release build

# Called by Create release PR on the release branch before the pull request
# exists (D28). No repo-infra piece builds a macOS app, so the build is
# MountWell's own release-build-local.yml. Read-only: nothing here writes the
# repository.
on:
  workflow_call:
    inputs:
      version:
        description: The version being released.
        type: string
        required: true
      ref:
        description: The release branch head to build.
        type: string
        required: true

permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/release-build-local.yml
    with:
      version: ${{ inputs.version }}
      ref: ${{ inputs.ref }}
    # the signing certificates and the notarization key (release-build-local.yml)
    secrets: inherit
